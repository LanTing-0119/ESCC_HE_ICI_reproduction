  <g id="text_15">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54 601.162187)">External support for treatment-benefit stratification does not establish that NB patients lack clinically meaningful benefit</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(54 612.36)">or that ICI can be omitted. Public examples do not reproduce trial numerical results.</text>
