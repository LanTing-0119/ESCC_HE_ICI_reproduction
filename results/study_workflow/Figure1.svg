   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(735.552 146.310281)">482 patients / 515 WSI</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(735.552 161.971187)">CT 240 / ICI+CT 242</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(735.552 177.632094)">Apply frozen JUPITER model</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(735.552 193.293)">No refitting or threshold adjustment</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(735.552 208.953906)">No fold strata in evaluation Cox models</text>
