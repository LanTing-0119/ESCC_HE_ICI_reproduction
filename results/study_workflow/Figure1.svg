    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="51.552" y="114.997969" transform="rotate(-0 51.552 114.997969)">H&amp;E representation</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.552 146.310281)">Tissue segmentation</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.552 161.971187)">20×, 256-pixel patches, 50% overlap</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.552 177.632094)">UNI-v2 → L2 normalization</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.552 193.293)">Patient-balanced P50 sampling</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(51.552 208.953906)">PCA128 → K90 → centered CLR</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="393.552" y="114.997969" transform="rotate(-0 393.552 114.997969)">JUPITER-06 development</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(393.552 146.310281)">472 patients / 487 WSI</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(393.552 161.971187)">CT 233 / ICI+CT 239</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(393.552 177.632094)">PFS-trained ridge Cox (0.01)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(393.552 193.293)">Prognosis + treatment + interaction</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(393.552 208.953906)">Fixed candidate and HR(z) threshold</text>
   </g>
   <g id="text_5">
